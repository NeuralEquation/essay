 {id:'A',name:'普通の因果型',tag:'原因から、結果へつなぐ',flow:['主張','原因・具体作用','中間結果','最終結果'],context:['First of all, competition can benefit consumers.','Competition encourages companies to lower prices.','This allows consumers to buy essential goods more affordably.','As a result, households can improve their living standards.'],slots:[
  {role:'段落開始・主張',base:'First of all, ...',explain:'段落の最初で、そのBodyの主張を示す。続く3行で、この主張が成り立つ理由を具体化する。',examples:['First of all, competition can benefit consumers.','First of all, new technology can improve workplace safety.'],alternatives:['First, ...','To begin with, ...']},
  {role:'原因・具体作用',base:'S + V ...',explain:'S = Subject（主語）、V = Verb（動詞）。固定フレーズではなく、普通の英文の骨格。1行目の主張がなぜ成り立つのかを、原因となるものを主語にして具体化する。',examples:['Competition encourages companies to lower prices.','New technology reduces the time needed for routine tasks.'],alternatives:[],note:'この位置では接続表現を暗記するのではなく、原因となる主語＋具体的な動詞を選ぶ。'},
  {role:'中間結果',base:'This allows A to V.',explain:'直前の原因によって「誰かが〜できるようになる」という中間結果を示す。Aは人・組織など、Vは動詞の原形。Thisが何を指すかを意識する。',examples:['This allows consumers to buy essential goods more affordably.','This allows students to access better educational opportunities.'],alternatives:['This enables A to V.','This helps A (to) V.']},

 ]},
 {id:'B',name:'動名詞主語型',tag:'行動の効果を、もう一段先へ',flow:['主張','行動の効果','因果の連鎖','大きな結果'],context:['Additionally, better education can reduce poverty.','Providing people with useful skills can improve their job prospects.','This, in turn, can increase their incomes.','Such an improvement can raise living standards.'],slots:[

  {role:'行動が生む効果',base:'V-ing ... can ...',explain:'「〜すること」を主語にして、その行動が生む効果を書く。単にテーマを挙げるのではなく、具体的な行動と効果を結ぶ。',examples:["Investing in education can improve workers' skills.",'Using new technology can improve productivity.'],alternatives:['V-ing ... could ...','V-ing ... would ...'],note:'can：可能・能力や一般的な効果。could：控えめな可能性や仮定。would：想定した条件のもとでの結果。完全な同義語ではなく、意味に応じて選ぶ。',prompt:'別の可能性・仮定の強さで表すなら？ 代案を1つと、その意味の違いを思い出してください。'},

 ]},

function home(){const m=metrics();return `<section class="hero"><div><p class="eyebrow">WRITE WITH A CLEAR STRUCTURE</p><h1>表現より先に、<br><span>4行の流れを覚えよう。</span></h1><p>「今、どんな役割の文を書く場所か。」<br>役割 → 基本表現 → 例文 → 言い換え。<br>短い反復で、Bodyを自分のものに。</p></div><div class="mini-body" aria-label="学習のイメージ"><div class="mini-label">A / BODY STRUCTURE</div><div class="mini-line"><span>01</span><strong>段落開始・主張</strong></div><div class="mini-line"><span>02</span><strong>原因・具体作用</strong></div><div class="mini-line active"><span>03</span><strong>中間結果</strong><span style="margin-left:auto">↗</span></div><div class="mini-line"><span>04</span><strong>最終結果</strong></div></div></section><div class="mode-grid"><button class="mode-card primary" data-action="navigate" data-view="study"><span class="mode-icon" aria-hidden="true">▤</span><span class="kicker">LEARN THE FLOW</span><strong>学習モード</strong><span class="desc">4行をタップして、構成を確認</span><span class="arrow" aria-hidden="true">→</span></button><button class="mode-card" data-action="navigate" data-view="test"><span class="mode-icon" aria-hidden="true">↻</span><span class="kicker">RECALL & REPEAT</span><strong>テストモード</strong><span class="desc">思い出す → 答えを見る → 自己評価</span><span class="arrow" aria-hidden="true">→</span></button></div><div class="stats"><div class="stat"><strong>${m.learned}<small>/ ${QUESTIONS.length}</small></strong><span>学習した問題数</span></div><div class="stat"><strong>${m.weak}<small>問</small></strong><span>△・× 苦手数</span></div><div class="stat"><strong>${state.streak}<small>回</small></strong><span>✓ 連続「言えた」</span></div></div><div class="section-title"><h2>いまの定着度</h2><span>未学習も含めた自己評価の目安</span></div><div class="mastery-grid">${[...PATTERNS.map(p=>({label:p.name,letter:p.id,qs:QUESTIONS.filter(q=>q.pattern===p.id&&q.kind!=='alt')})),{label:'言い換え',letter:'↔',qs:QUESTIONS.filter(q=>q.kind==='alt')}].map(x=>{const learned=x.qs.filter(q=>ratingCount(record(q.id))>0).length;return `<div class="mastery-card"><div class="mastery-top"><span class="mastery-name"><span class="letter">${x.letter}</span>${x.label}</span><strong>${mastery(x.qs)}%</strong></div><div class="bar"><span style="width:${mastery(x.qs)}%"></span></div><small>${learned?`${learned} / ${x.qs.length} 問を学習済み`:'未学習 · まずは4行の流れから'}</small></div>`;}).join('')}</div><p class="fine">定着度：各問題の「言えた」= 100、「怪しい」= 50、「無理」・未学習 = 0として平均。型の定着度は型まるごと＋スロット想起、言い換えは別集計です。</p><div class="method"><span class="big" aria-hidden="true">◎</span><div><strong>1セット10問。短く、何度でも。</strong><p>無理 → 怪しい → 未学習 → 言えた の順に優先。<br>苦手な「位置と役割」を、もう一度思い出そう。</p></div></div>`;}

function study(){return `<div class="page-head"><p class="eyebrow">LEARN THE FLOW</p><h1>位置と役割を、ひとまとまりに。</h1><p>型を開き、まず論理の流れを確認。英文は1行ずつタップで表示・非表示にできます。</p></div>${PATTERNS.map(p=>`<section class="pattern"><button class="pattern-toggle" data-action="pattern" data-pattern="${p.id}" aria-expanded="${studyOpen[p.id]}" aria-controls="pattern-${p.id}"><span class="title"><span class="letter">${p.id}</span><span><strong>${p.name}</strong><small>${p.tag}</small></span></span><span class="chevron" aria-hidden="true">${studyOpen[p.id]?'−':'＋'}</span></button><div class="pattern-content" id="pattern-${p.id}" ${studyOpen[p.id]?'':'hidden'}>${studyOpen[p.id]?flow(p)+`<div class="tools"><button class="btn" data-action="all" data-pattern="${p.id}" data-show="yes">すべて表示</button><button class="btn" data-action="all" data-pattern="${p.id}" data-show="no">すべて隠す</button><button class="btn" data-action="random" data-pattern="${p.id}">ランダムに隠す</button></div>`+p.slots.map((s,i)=>{const id=p.id+'-'+i;return `<div class="slot"><button class="slot-toggle" data-action="slot" data-id="${id}" aria-expanded="${!!slotOpen[id]}" aria-controls="answer-${id} details-${id}"><span class="slot-label"><span><span class="number">0${i+1}</span>${s.role}</span><span class="toggle-symbol" aria-hidden="true">${slotOpen[id]?'−':'＋'}</span></span>${slotOpen[id]?`<span id="answer-${id}" class="english" lang="en">${esc(s.base)}</span>`:`<span id="answer-${id}" class="answer-prompt">タップして答えを見る</span>`}</button><div id="details-${id}" ${slotOpen[id]?'':'hidden'}>${slotOpen[id]?details(p,s,i):''}</div></div>`;}).join(''):''}</div></section>`).join('')}<p class="fine">学習画面の開閉は定着度に影響しません。テストの自己評価で記録します。</p>`;}

  });
  function offerUpdate(){if(registration?.waiting)$('#pwa-update').hidden=false;}
  $('#pwa-update').addEventListener('click',()=>{if(!registration?.waiting)return;updating=true;$('#pwa-update').disabled=true;registration.waiting.postMessage({type:'ACTIVATE_UPDATE'});});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(updating)location.reload();});
  navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'}).then(reg=>{
    registration=reg;offerUpdate();
    reg.addEventListener('updatefound',()=>{const worker=reg.installing;worker?.addEventListener('statechange',()=>{if(worker.state==='installed')offerUpdate();});});
    return navigator.serviceWorker.ready;
  }).then(()=>{$('#pwa-status').textContent='✓ オフラインで使えます。学習記録はこの端末に保存。';}).catch(()=>{$('#pwa-status').textContent='オフラインの準備ができませんでした。通信できる状態で再読み込みしてください。';});
}
</script>
</body>
</html>
